# Supabase pausiert Gratis-Projekte nach etwa einer Woche ohne Anfragen.
# Dieser Ablauf fragt einmal täglich kurz nach. Die Nutzer merken davon nichts.
# Achtung: GitHub schaltet zeitgesteuerte Abläufe nach 60 Tagen ohne Änderungen
# im Repository ab (vorher kommt eine E-Mail). Dann unter "Actions" wieder einschalten.
name: Supabase wachhalten

on:
  schedule:
    - cron: '17 5 * * *'   # täglich 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase anpingen
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" app/js/config.js)
          KEY=$(grep -oP "SUPABASE_KEY = '\K[^']+" app/js/config.js)
          if [[ "$URL" == HIER_* ]]; then
            echo "Supabase ist noch nicht eingetragen – nichts zu tun."
            exit 0
          fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase hat geantwortet."
